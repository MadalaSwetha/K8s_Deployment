[defaults]
inventory = inventory/production
role_path = roles
host_key_checking = False
retry_files_enabled = False
remote_user = ubuntu
timeout = 30
deprecation_warnings = False
interpreter_python = auto_silent

[inventory]
enable_plugins = ini, yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
