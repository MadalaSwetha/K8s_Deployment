apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Log all requests at the Metadata level
  - level: Metadata
    omitStages:
      - RequestReceived
  # Log pod exec at RequestResponse level
  - level: RequestResponse
    verbs:
      - create
      - update
      - patch
      - delete
    resources:
      - pods
      - pods/log
      - pods/exec
    namespaces:
      - "default"
      - "kube-system"
